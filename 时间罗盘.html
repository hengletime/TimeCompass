  body.b-aurora #bgfx::after{top:16%;background:linear-gradient(80deg,transparent,rgba(120,0,255,.35),rgba(0,255,200,.4),transparent);animation:aur2 9s steps(20) infinite alternate}

     为什么不用 CSS 连续动画：连续 transform 动画会以显示器刷新率（60/144Hz）持续产帧，
     而盘面 SVG 每秒都在改内容 → 每帧重新栅格化整张盘面，实测吃掉半个核（风扇狂转的元凶）。
     为什么也不用"每秒一大步"：每步约 4px，顿挫肉眼可见。

/* ============================================================

function lYearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(LUNAR_INFO[y-1900]&i)?1:0;return s+lLeapDays(y)}
function lLeapMonth(y){return LUNAR_INFO[y-1900]&0xf}
function lLeapDays(y){const m=lLeapMonth(y);return m?((LUNAR_INFO[y-1900]&0x10000)?30:29):0}
function lMonthDays(y,m){return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29}
function toLunar(dt){
  /* 压缩表只覆盖 1900-2100：手动"设置时间"面板可把年份调出界，
     LUNAR_INFO[y-1900] 会 undefined → NaN 级联污染农历/干支环与信息卡（D-14） */
  const yr=dt.getFullYear();
  if(yr<1901||yr>2100) return {year:1900,month:1,day:1,isLeap:false};
  let offset=Math.floor((Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())-Date.UTC(1900,0,31))/86400000);
  let year=1900,temp;
  for(let i=1900;i<2101&&offset>0;i++){temp=lYearDays(i);if(offset<temp){year=i;break}offset-=temp}
  const leap=lLeapMonth(year);let isLeap=false,month=1;
  for(month=1;month<13&&offset>0;month++){
    if(leap>0&&month===leap+1&&!isLeap){--month;isLeap=true;temp=lLeapDays(year)}
    else temp=lMonthDays(year,month);
    if(isLeap&&month===leap+1)isLeap=false;
    if(offset<temp)break;
    offset-=temp;
  }
  return {year,month,day:offset+1,isLeap};
}
/* 节气近似锚点（误差±1天）：自立春起的 (月,日) */
const JQ_MD=[[2,4],[2,19],[3,5],[3,20],[4,4],[4,20],[5,5],[5,21],[6,5],[6,21],[7,7],[7,22],[8,7],[8,23],[9,7],[9,23],[10,8],[10,23],[11,7],[11,22],[12,7],[12,21],[1,5],[1,20]];
function jqAnchor(y,idx){
  const [m,d]=JQ_MD[idx];
  return Date.UTC(m>=2?y:y+1,m-1,d);   // 小寒/大寒属次年年初
}
function jqState(now){
  const t=now.getTime(), y=now.getFullYear();
  const list=[];
  for(let i=0;i<24;i++){list.push([jqAnchor(y-1,i),i]);list.push([jqAnchor(y,i),i])}
  list.sort((a,b)=>a[0]-b[0]);
  let cur=list[0],nx=list[1];
  for(let k=0;k<list.length-1;k++){
    if(t>=list[k][0]&&t<list[k+1][0]){cur=list[k];nx=list[k+1];break}
  }
  return {idx:cur[1],next:JQ[nx[1]],nextIn:Math.ceil((nx[0]-t)/86400000)};

/* 干支 */
function ganzhiYear(y){const idx=((y-4)%60+60)%60;return{idx,gan:idx%10,zhi:idx%12}}
function ganzhiDay(dt){
  const days=Math.round(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/86400000)-Math.round(Date.UTC(2000,0,1)/86400000);
  const idx=((15+days)%60+60)%60;   // 2000-01-01 = 己卯 = 15
  return{idx,gan:idx%10,zhi:idx%12};
}
/* 月相：基准新月 2000-01-06 18:14 UTC */
function getMoon(dt){
  let ph=((dt.getTime()-Date.UTC(2000,0,6,18,14))/86400000)%SYNODIC; if(ph<0)ph+=SYNODIC;
  return {phase:ph,f:ph/SYNODIC};
}
/* ================= SVG 工具 =================
 * 角度约定：aDeg 从正上方 12 点起算，顺时针增大；180 = 正下方 6 点（色块柱位置） */
function pol(r,aDeg){const rad=(aDeg-90)*Math.PI/180;return [r*Math.cos(rad),r*Math.sin(rad)]}
function sector(r1,r2,a1,a2){
  const p1=pol(r2,a1),p2=pol(r2,a2),p3=pol(r1,a2),p4=pol(r1,a1);
  return `M${p1[0]},${p1[1]} A${r2},${r2} 0 0 1 ${p2[0]},${p2[1]} L${p3[0]},${p3[1]} A${r1},${r1} 0 0 0 ${p4[0]},${p4[1]} Z`;
}
function el(tag,attrs,parent){const e=document.createElementNS(SVG_NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
/* 月相亮面路径：f∈[0,1) 0=朔 0.5=望（北半球，盈月光在右） */
function moonLitPath(r,f){
  if(f<=0.018||f>=0.982)return '';
  const k=Math.cos(2*Math.PI*f), rx=(Math.abs(k)*r).toFixed(3);
  if(f<0.5){  // 盈：右半亮
    const sweep=k>0?0:1;   // 蛾眉:端点弧向右凹 / 凸月:向左凸
    return `M0,${-r} A${r},${r} 0 0 1 0,${r} A${rx},${r} 0 0 ${sweep} 0,${-r} Z`;
  }else{      // 亏：左半亮
    const sweep=k<0?0:1;
    return `M0,${-r} A${r},${r} 0 0 0 0,${r} A${rx},${r} 0 0 ${sweep} 0,${-r} Z`;
  }
}

/* ====== 派生量快照：农历/节气/月相/干支每分钟只算一次 ======
 * 旧版在 60fps 主循环里每帧重算（jqState 要建 48 元素数组再排序、toLunar 要循环上百年）
 * → 每秒 60 次纯属浪费。现在按"分钟"做缓存键。 */
let S=null,Skey='';
function ensureSnap(dt){
  const k=dt.getFullYear()+'-'+dt.getMonth()+'-'+dt.getDate()+'-'+dt.getHours()+'-'+dt.getMinutes();
  if(k!==Skey){
    Skey=k;
    S={l:toLunar(dt),jq:jqState(dt),moon:getMoon(dt),
       gy:ganzhiYear(dt.getFullYear()),gd:ganzhiDay(dt)};
  }
  return S;
}

/* ================= 15 层环定义（内 → 外） =================
 * 每环 n 格，格 i 中心角 = 180° - i*step；
 * 显示时整环 rotate(+idx*step)，把当前格瞬移到正下方色块柱处 —— 环是跳格的，柱永远不动 */
const RING_DEFS=[
 {key:'week',   n:7,  r1:72, r2:102, fs:13, fmt:i=>WEEK[i],                 idx:dt=>dt.getDay()},
 {key:'zodiac', n:12, r1:102,r2:130, fs:13, fmt:i=>ZODIAC[i]+'年',          idx:dt=>S.gy.zhi},
 {key:'smon',   n:12, r1:130,r2:158, fs:13, fmt:i=>(i+1)+'月',              idx:dt=>dt.getMonth()},
 {key:'lmon',   n:12, r1:158,r2:186, fs:13, fmt:i=>LUNAR_M[i]+'月',         idx:dt=>(S.l.month-1)%12},
 {key:'jq',     n:24, r1:186,r2:214, fs:12, fmt:i=>JQ[i],                   idx:dt=>S.jq.idx},
 {key:'sday',   n:31, r1:214,r2:242, fs:11, fmt:i=>(i+1)+'日',              idx:dt=>dt.getDate()-1},
 {key:'lday',   n:30, r1:242,r2:270, fs:12, fmt:i=>LUNAR_D[i],              idx:dt=>S.l.day-1},
 {key:'mname',  n:8,  r1:270,r2:294, fs:12, fmt:i=>MOON_NAMES[i],           idx:dt=>Math.floor(S.moon.f*8)%8},
 {key:'mph',    n:30, r1:294,r2:328, moon:true,                             idx:dt=>Math.round(S.moon.f*30)%30},
 {key:'shichen',n:12, r1:328,r2:356, fs:13, fmt:i=>ZHI[i]+'时',             idx:dt=>Math.floor((dt.getHours()+1)/2)%12},
 {key:'merid',  n:12, r1:356,r2:384, fs:11, fmt:i=>MERIDIAN[i],             idx:dt=>Math.floor((dt.getHours()+1)/2)%12},
 {key:'hour',   n:24, r1:384,r2:412, fs:12, fmt:i=>i+'时',                  idx:dt=>dt.getHours()},
 {key:'ygz',    n:60, r1:412,r2:440, fs:11, fmt:i=>GAN[i%10]+ZHI[i%12],     idx:dt=>S.gy.idx},
 {key:'min',    n:60, r1:440,r2:468, fs:11, fmt:i=>i+'分',                  idx:dt=>dt.getMinutes()},
 {key:'sec',    n:60, r1:468,r2:496, fs:11, fmt:i=>i+'秒',                  idx:dt=>dt.getSeconds()},
];
const svg=document.getElementById('dial');
const beamG=el('g',{class:'beamP'},svg);   // 固定色块柱层（垫底：蓝色垫底，环文字从上面滑过）
const ringsG=el('g',{},svg);               // 旋转环层（格子和文字随环一起转动）
const centerG=el('g',{},svg);

/* ================= 构建各环 ================= */
const ringObjs={};
for(const d of RING_DEFS){
  const g=el('g',{class:'ring'},ringsG);
  const step=360/d.n;
  for(let i=0;i<d.n;i++){
    const aMid=180-i*step;
    el('path',{d:sector(d.r1,d.r2,aMid-step/2,aMid+step/2),class:'cell'},g);
    if(!d.moon&&d.fmt){
      const [x,y]=pol((d.r1+d.r2)/2,aMid);
      const t=el('text',{x,y,'font-size':d.fs,class:'ctext',
        transform:`rotate(${aMid-180} ${x} ${y})`},g);   // 切向排布：字顶朝圆心
      t.textContent=d.fmt(i);
    }
  }
  ringObjs[d.key]={g,def:d,lastIdx:-1};
}
/* 月相图形环：30 个小月亮 */
(function(){
  const d=RING_DEFS.find(x=>x.key==='mph'), g=ringObjs.mph.g, step=360/d.n;
  for(let i=0;i<30;i++){
    const aMid=180-i*step, [x,y]=pol((d.r1+d.r2)/2,aMid), r=12;
    const mg=el('g',{transform:`translate(${x},${y})`},g);
    el('circle',{r,fill:'#12151d',stroke:'rgba(255,255,255,.25)','stroke-width':.5},mg);
    const lp=moonLitPath(r,i/30);
    if(lp)el('path',{d:lp,fill:'#d8deea'},mg);
  }
})();
/* 外边界细圈 */
el('circle',{r:496,fill:'none',stroke:'rgba(255,255,255,.30)','stroke-width':1},ringsG);
/* ================= 固定色块柱（正下方 180°，永远不动） =================
 * 只画蓝色底块；格内文字属于旋转环，随环一起滑入色块落定 */
for(const d of RING_DEFS){
  const step=360/d.n;
  el('path',{d:sector(d.r1,d.r2,180-step/2,180+step/2),
    fill:BLUE,stroke:'rgba(255,255,255,.55)','stroke-width':.6},beamG);
}

/* ================= 中心年份 ================= */
el('circle',{r:72,fill:'#000',stroke:'rgba(255,255,255,.55)','stroke-width':1.2},centerG);
const centerYear=el('text',{x:0,y:-8,'font-size':40,class:'btext','font-weight':700},centerG);
centerYear.textContent='—';
const centerSub=el('text',{x:0,y:24,'font-size':13,class:'ctext',fill:'#8fa2c4'},centerG);
centerSub.textContent='';

let paused=false, pausedAt=null;
let lastYear=null, lastCard='';

/* ================= 时辰信息卡 ================= */
const $=id=>document.getElementById(id);
function renderCard(dt){
  ensureSnap(dt);
  const l=S.l, sc=Math.floor((dt.getHours()+1)/2)%12;
  const jq=S.jq, moon=S.moon, gy=S.gy, gd=S.gd;
  const gh=GAN[((gd.gan%5)*2+sc)%10]+ZHI[sc];
  const ill=Math.round((1-Math.cos(moon.f*2*Math.PI))/2*100);
  $('cShi').textContent=ZHI[sc]+'时 · '+SHI_CHEN_DESC[sc];
  $('cMer').textContent=MERIDIAN[sc];
  $('cYi').textContent=YIJI[sc][0];
  $('cJi').textContent=YIJI[sc][1];
  $('cJq').textContent=JQ[jq.idx]+' · 下一节气 '+jq.next+' '+jq.nextIn+'天后';
  $('cPh').textContent=JQ_PHEN[JQ[jq.idx]]||'—';
  $('cMoon').textContent=MOON_NAMES[Math.floor(moon.f*8)%8]+' · 亮度 '+ill+'%';
  $('cGz').textContent=GAN[gy.gan]+ZHI[gy.zhi]+'年 '+GAN[gd.gan]+ZHI[gd.zhi]+'日 '+gh+'时 · 农历'+(l.isLeap?'闰':'')+LUNAR_M[l.month-1]+'月'+LUNAR_D[l.day-1];
}

function update(dt){
  ensureSnap(dt);
  for(const d of RING_DEFS){
    const r=ringObjs[d.key];
    const idx=((d.idx(dt)%d.n)+d.n)%d.n;
    if(idx!==r.lastIdx){
      const step=360/d.n;
      const first=r.lastIdx===-1;
      /* 累计角度：永远只向前转 delta 格，59→0 也只转 1 格不倒转 */
      const delta=first?idx:((idx-r.lastIdx)%d.n+d.n)%d.n;
      r.rot=(r.rot||0)+delta*step;
      if(first){
        r.g.style.transition='none';          // 首次渲染直接就位，不播动画
        r.g.style.transform=`rotate(${r.rot}deg)`;
        r.g.getBoundingClientRect();          // 强制回流后再恢复过渡
        setTimeout(()=>{r.g.style.transition=''},0);
      }else{
        r.g.style.transform=`rotate(${r.rot}deg)`;   // 播放 0.26s 单格旋转
      }
      r.lastIdx=idx;
    }
  }
  if(dt.getFullYear()!==lastYear){
    lastYear=dt.getFullYear();
    const gy=ganzhiYear(lastYear);
    centerYear.textContent=lastYear;
    centerSub.textContent=GAN[gy.gan]+ZHI[gy.zhi]+'年 · '+ZODIAC[gy.zhi];
  }
  /* 信息卡：时辰或日期变化时刷新（出错也不得拖死主循环） */
  const ck=dt.toDateString()+':'+Math.floor((dt.getHours()+1)/2)%12;
  if(ck!==lastCard){
    lastCard=ck;
    try{renderCard(dt)}catch(e){console.warn('card:',e)}
  }
}

/* ================= 自定义时间偏移 + 主循环 =================
 * 旧版用 requestAnimationFrame → 每秒被催 60 次（高刷屏 144 次），
 * 而盘面最快也只每秒变一格，纯属空转。
 * 现在：显式对齐到"下一个整秒"，每秒只跑一次；滴答声也在同一个节拍上，
 * 不再需要 50ms 轮询定时器。 */
let timeOffset=0;                       // 自定义时间 = 当前系统时间 + 偏移
function currentDT(){ return paused?pausedAt:new Date(Date.now()+timeOffset); }

/* ============ 防烧屏漂移（李萨如轨迹 · 按时间求值 + 可控帧率） ============
 * 轨迹：水平 ±5vw / 47 秒一个来回；垂直 ±4vh / 73 秒一个来回。
 *   47 与 73 互质 → 轨迹永不重合，长期运行能覆盖盘面所有像素位置，
 *   这才是防烧屏真正需要的性质（不是"动起来"就行）。
 * 帧率：由 QCFG.driftMs 控制（默认 15Hz，见 Q_PRESET）。早期的"每秒推一大步"虽然最省，
 *   但每步 4px 肉眼能看出顿挫；现在峰值步长不足 1px，抗锯齿下即为连续滑动。
 *   实测：屏保 CPU 与产帧数几乎严格线性（1Hz≈0.25 核 / 15Hz≈0.40 核 / 60Hz≈1.0 核），
 *   所以这里每一毫秒的取舍都是量出来的，不是拍脑袋。
 * 位置按"启动至今的真实秒数"直接求值（不做累加），定时器抖动不影响轨迹。 */
const wrapEl=document.getElementById('wrap');
const dialEl=document.getElementById('dial');
let driftTimer=null, driftT0=0;
function driftApply(){
  const t=(Date.now()-driftT0)/1000;
  const x=5*Math.sin(t*2*Math.PI/47);
  const y=4*Math.sin(t*2*Math.PI/73+0.9);
  wrapEl.style.transform='translate3d('+x.toFixed(3)+'vw,0,0)';
  dialEl.style.transform='translate3d(0,'+y.toFixed(3)+'vh,0)';
}
function startDrift(){
  driftT0=Date.now(); driftApply();
  if(driftTimer)clearInterval(driftTimer);
  driftTimer=setInterval(driftApply, QCFG.driftMs);
}

let loopTimer=null, lastSec=-1;
function loop(){
  const dt=currentDT();
  try{ update(dt); }catch(e){ console.warn('update:',e) }
  /* 滴答声：与主循环共用节拍（每秒一次），省掉旧版 20Hz 的轮询 */
  if(tickOn && dt.getSeconds()!==lastSec){ lastSec=dt.getSeconds(); beep(lastSec===0); }
  loopTimer=setTimeout(loop, 1000-(Date.now()%1000)+12);
}

/* ================= 控制按钮 ================= */
let audioCtx=null, tickOn=false;
function beep(strong){
  if(!tickOn)return;
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=strong?1320:990;
    g.gain.setValueAtTime(strong?0.38:0.24,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.09);
    o.connect(g).connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+0.06);
  }catch(e){ tickOn=false; }   // 音频不可用时静默关闭，避免定时器持续抛错
}
document.getElementById('bTick').onclick=e=>{
  tickOn=!tickOn;
  e.target.textContent=tickOn?'滴答 声开':'滴答 声';
  if(tickOn)lastSec=-1;                     // 立即跟上节拍，不用等下一秒
};
document.getElementById('bPause').onclick=e=>{
  paused=!paused;
  if(paused)pausedAt=new Date();
  e.target.textContent=paused?'继续':'暂停';
  update(currentDT());
};
document.getElementById('bFull').onclick=()=>{
  if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen();
};

/* ================= 鼠标滚轮缩放整个盘面 =================
 * v4.0(D-15)：屏保模式不注册 wheel/dblclick —— 滚轮在 SCR 下仍可把盘面放大到 6×，
 * 且 applyTf 与 driftApply 写同一元素（#dial/svg）的 transform 会互相覆盖，
 * 漂移轨迹会被视差变换打断。 */
let zoom=1;
const clampZ=v=>Math.min(6,Math.max(0.35,v));
if(!SCR){
  window.addEventListener('wheel',e=>{
    e.preventDefault();
    zoom=clampZ(zoom*(e.deltaY<0?1.12:1/1.12));
    applyTfSoon();
  },{passive:false});
  svg.addEventListener('dblclick',()=>{zoom=1;lastRx=0;lastRy=0;applyTf();});
}

/* ================= 自定义时间面板 ================= */
const timePanel=document.getElementById('timePanel');
const timeInput=document.getElementById('timeInput');
const pad2=n=>String(n).padStart(2,'0');
function toLocalInput(v){
  return v.getFullYear()+'-'+pad2(v.getMonth()+1)+'-'+pad2(v.getDate())
        +'T'+pad2(v.getHours())+':'+pad2(v.getMinutes())+':'+pad2(v.getSeconds());
}
document.getElementById('bTime').onclick=()=>{
  timeInput.value=toLocalInput(currentDT());
  timePanel.classList.toggle('open');
};
document.getElementById('bApply').onclick=()=>{
  const v=new Date(timeInput.value);
  if(!isNaN(v.getTime())){
    timeOffset=v.getTime()-Date.now();
    paused=false;
    document.getElementById('bPause').textContent='暂停';
    update(currentDT());
  }
  timePanel.classList.remove('open');
};
document.getElementById('bNow').onclick=()=>{
  timeOffset=0;
  paused=false;
  lastSec=-1;
  document.getElementById('bPause').textContent='暂停';
  update(currentDT());
  timePanel.classList.remove('open');
};

/* ================= 背景切换：深空/星空/星云/极光/网格 ================= */
const BGS=['深空','星空','星云','极光','网格'];
let bgIdx=0, starTimer=null, starGen=0, starResize=null;
const bgCv=document.getElementById('bgStars');
/* resize 监听只注册一次（旧版每次切背景都 addEventListener，会不断累积） */
window.addEventListener('resize',()=>{ if(starResize) starResize(); });

/* 星空：定时驱动（不再用 rAF），速率与显示器刷新率解耦；
 * 用 globalAlpha 代替每颗星拼一次 rgba 字符串（旧版每秒上万次字符串分配）。 */
function startStars(){
  const ctx=bgCv.getContext('2d');
  const TAU=Math.PI*2;
  const gen=++starGen;
  let W,H,stars=[],meteors=[],drawn=0,lastTick=0,gapSum=0;
  function mkStar(){
    return {x:Math.random()*W, y:Math.random()*H,
      r:.35+Math.random()*1.15,
      s:.22+Math.random()*.78,      /* 呼吸速度各不相同 → 周期约 6.5~28 秒 */
      p:Math.random()*TAU,          /* 相位错开，避免整屏同步闪 */
      c:NaN};                       /* 上一帧 cos 值，用于捕捉"最暗时刻"；NaN=首帧不判定 */
  }
  /* 换位置：呼吸到最暗的一瞬才跳——此刻该星透明度为 0，跳变肉眼不可见 */
  function respawn(st){
    st.x=Math.random()*W;
    st.y=Math.random()*H;
    st.r=.35+Math.random()*1.15;
  }
  function rs(){
    W=bgCv.width=innerWidth; H=bgCv.height=innerHeight;
    stars=new Array(QCFG.stars);
    for(let i=0;i<QCFG.stars;i++) stars[i]=mkStar();
  }
  rs();
  starResize=rs;
  function frame(){
    if(gen!==starGen) return;
    starTimer=setTimeout(frame, QCFG.starMs);
    const now=Date.now();
    gapSum+=now-(lastTick||now); lastTick=now;
    ctx.clearRect(0,0,W,H);
    const t=Date.now()/1000;
    ctx.fillStyle='#c8dcff';
    for(let i=0;i<stars.length;i++){
      const st=stars[i];
      const ph=t*st.s+st.p, cos=Math.cos(ph);
      /* cos 由负转正 ⇔ 恰好经过 sin 的极小值（最暗点）→ 在此刻迁到新位置 */
      if(st.c===st.c && st.c<0 && cos>=0) respawn(st);
      st.c=cos;
      const bright=.5+.5*Math.sin(ph);      /* 0=最暗 1=最亮 */
      if(bright<.02) continue;              /* 最暗那一瞬不绘制，让"换位"彻底隐形 */
      ctx.globalAlpha=.14+.68*Math.pow(bright,1.15);
      ctx.beginPath();ctx.arc(st.x,st.y,st.r*(.7+.55*bright),0,TAU);ctx.fill();
    }
    ctx.globalAlpha=1;
    drawn++;
    /* 流星：从屏幕右外侧起飞（不在画面中间凭空出现），速度/尾长逐颗随机 */
    if(Math.random()<0.012&&meteors.length<3){
      const sp=4.2+Math.random()*3.4;
      meteors.push({x:W+20+Math.random()*160, y:Math.random()*H*.5,
        vx:-sp, vy:sp*(0.36+Math.random()*0.22),
        life:1, tail:14+Math.random()*8});}
    /* 彗尾用"渐细填充三角形"而不是等宽 stroke：
       1px 以下的线段在抗锯齿下每像素只覆盖约 20%，实测拖尾中点像素 alpha 仅 20/255
       —— 这在黑底上等于看不见，才是"没有拖尾效果"的真正原因（不是渐变没写对）。
       填充同宽度要亮好几倍，且"头宽尾尖"本身就是彗尾该有的形状。 */
    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i];
      m.x+=m.vx;m.y+=m.vy;
      m.life-=QCFG.starMs/3200;          /* 寿命固定约 3.2 秒，与帧率无关 */
      if(m.life<=0||m.x<-300||m.y>H+300){ meteors.splice(i,1); continue; }
      /* 亮度：前 70% 行程保持满亮（流星是"划过去"，不是"原地变暗"），
         最后 30% 才淡出；旧版整条生命线性衰减 → 后一半几乎看不见，白飞了 */
      const a=(m.life>0.3 ? 1 : m.life/0.3);
      const vlen=Math.hypot(m.vx,m.vy)||1;
      const ux=-m.vy/vlen*0.65, uy=m.vx/vlen*0.65;   /* 法向半宽 → 头端总宽 1.3px（比旧版 1.4px 更细） */
      const tx=m.x-m.vx*m.tail, ty=m.y-m.vy*m.tail;  /* 尾尖 */
      const g=ctx.createLinearGradient(tx,ty,m.x,m.y);
      g.addColorStop(0,   'rgba(120,210,255,0)');
      g.addColorStop(0.28,'rgba(150,230,255,'+(a*0.55).toFixed(3)+')');
      g.addColorStop(0.62,'rgba(200,240,255,'+(a*0.88).toFixed(3)+')');
      g.addColorStop(1,   'rgba(255,255,255,'+(a*1.00).toFixed(3)+')');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(tx,ty);
      ctx.lineTo(m.x+ux,m.y+uy);
      ctx.lineTo(m.x-ux,m.y-uy);
      ctx.closePath();
      ctx.fill();
      /* 头端亮核：一点点白光，让"坠落感"更明确（不用 shadowBlur，那个太贵） */
      ctx.globalAlpha=a;
      ctx.fillStyle='#f4fbff';
      ctx.beginPath();ctx.arc(m.x,m.y,1.05,0,TAU);ctx.fill();
      ctx.globalAlpha=1;
    }
    /* 自适应降级：连续 300 帧以上、且实测平均帧间隔超过目标 2.2 倍，才判定机器跟不上，
     * 自动减星（老电脑 / 高分屏也顺滑）。样本不足时不动手，避免误伤。 */
    if(drawn>=300){
      const avgGap=gapSum/drawn;
      if(avgGap>QCFG.starMs*2.2 && QCFG.stars>70){
        QCFG.stars=Math.max(70,Math.round(QCFG.stars*0.6));
        console.info('[时间罗盘] 实测帧间隔 '+avgGap.toFixed(0)+'ms 偏慢，星点自动降到 '+QCFG.stars);
        setBG(bgIdx);
        return;
      }
      drawn=0;gapSum=0;
    }
  }
  frame();
}
function stopStars(){
  starGen++;                       // 让在途的那一帧自行退出
  starResize=null;
  if(starTimer){clearTimeout(starTimer);starTimer=null}
}
function setBG(i){
  bgIdx=((i%BGS.length)+BGS.length)%BGS.length;
  document.body.classList.remove('b-nebula','b-aurora','b-grid');
  bgCv.style.display='none';
  stopStars();
  const name=BGS[bgIdx];
  if(name==='星空'){bgCv.style.display='block';startStars()}
  else if(name==='星云')document.body.classList.add('b-nebula');
  else if(name==='极光')document.body.classList.add('b-aurora');
  else if(name==='网格')document.body.classList.add('b-grid');
  document.getElementById('bBg').textContent='背景 · '+name;
}
document.getElementById('bBg').onclick=()=>setBG(bgIdx+1);
document.getElementById('bCard').onclick=()=>document.getElementById('infoCard').classList.toggle('open');
document.getElementById('infoCard').classList.add('open');   // 默认展开

/* ================= 屏保模式（以 file:///...#scr 方式打开时） =================
 * 隐藏所有控件与鼠标指针，默认切到星空流星背景 */
if(SCR){
  document.getElementById('btns').style.display='none';
  document.getElementById('timePanel').style.display='none';
  document.body.style.cursor='none';
  setBG(1);
  /* 子午流注卡片：紧凑+半透明，避免遮挡罗盘 */
  const card=document.getElementById('infoCard');
  card.classList.add('open');
  card.style.width='260px';   /* 干支行18字需约240px，196px会折行 */
  card.style.fontSize='10.5px';
  card.style.padding='7px 10px';
  card.style.opacity='0.68';
  card.style.pointerEvents='none';

  /* ================= 防烧屏引擎 v4（仅屏保模式） =================
   * 移动周期一览：
   * 1) 盘面漂移：水平 47s / 垂直 73s 一个来回，20Hz 亚像素步进（driftApply/startDrift）
   * 2) 亮度呼吸：全屏遮罩 opacity 0→0.15，96s 一个来回，用 steps(32) 离散化
   *    （旧版连续渐变 = 每帧都要重合成整屏；现在 96 秒只变 32 次）
   * 3) 信息卡四角轮巡：每 2 分钟淡出→顺时针换下一角→淡入（只用 inset 定位） */
  document.body.classList.add('scr');
  startDrift();
  const dim=document.createElement('div');
  dim.style.cssText='position:fixed;inset:0;background:#000;pointer-events:none;z-index:5;'
                  + 'animation:scrDim 96s steps(32) infinite alternate';
  document.body.appendChild(dim);

  const CORNERS=[
    {top:'16px',right:'16px',left:'auto',bottom:'auto'},
    {bottom:'16px',right:'16px',top:'auto',left:'auto'},
    {bottom:'16px',left:'16px',top:'auto',right:'auto'},
    {top:'16px',left:'16px',right:'auto',bottom:'auto'}
  ];
  let cornerIdx=0;
  card.style.transition='opacity 1.2s ease';
  setInterval(()=>{
    card.style.opacity='0';
    setTimeout(()=>{
      cornerIdx=(cornerIdx+1)%CORNERS.length;
      Object.assign(card.style,CORNERS[cornerIdx]);
      card.style.opacity='0.68';
    },1300);
  },120000);

  /* 自动开启滴答声（Edge 需配合 --autoplay-policy=no-user-gesture-required） */
  tickOn=true;
  lastSec=-1;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.resume)audioCtx.resume();
  }catch(e){}
}

/* ================= 鼠标视差 3D 倾斜 ================= */
let lastRx=0,lastRy=0;
function applyTf(){
  svg.style.transform=`scale(${zoom}) rotateX(${lastRx}deg) rotateY(${lastRy}deg)`;
}
/* 高频输入节流（浏览器交互模式）：1000Hz 回报率的游戏鼠标下，mousemove
 * 每秒能来 1000 次，每次直接写 style.transform 就要触发同等次数的
 * 样式计算 + 合成提交。用 rAF 合并：一帧内多次事件只落一次写入，
 * 频率上限 = 显示器刷新率；空闲时不注册任何回调，零开销。 */
let tfPending=false;
function applyTfSoon(){
  if(tfPending) return;
  tfPending=true;
  requestAnimationFrame(()=>{ tfPending=false; applyTf(); });
}
/* 屏保模式没有鼠标，直接不注册 —— 省掉一个常驻合成层与每次 mousemove 的样式写入 */
if(!SCR){
  window.addEventListener('mousemove',e=>{
    lastRy=(e.clientX/innerWidth*2-1)*4;
    lastRx=-(e.clientY/innerHeight*2-1)*4;
    applyTfSoon();
  });
}

/* ================= 启动主循环（最后启动，保证前面的桩都已就绪） ================= */
update(currentDT());
loop();

/* ================= 性能监视器 =================
 * 按 P 键（或地址栏加 #perf）呼出。看的是"实际渲染帧率"——
 * 它直接决定 CPU/GPU 负载与风扇转速，比任何间接指标都直观。 */
const perfEl=document.getElementById('perf');
let perfOn=(HASH.indexOf('perf')>=0), rafTicks=0, rafT0=0, fps=0;
function perfToggle(on){
  perfOn=(on===undefined)?!perfOn:on;
  perfEl.classList.toggle('open',perfOn);
  if(perfOn){ rafTicks=0; rafT0=performance.now(); rafSample(); }
}
function rafSample(){
  if(!perfOn) return;
  rafTicks++;
  const n=performance.now();
  if(n-rafT0>=1000){
    fps=rafTicks*1000/(n-rafT0); rafTicks=0; rafT0=n;
    perfEl.textContent=
      '实际渲染帧率  '+fps.toFixed(0)+' fps\n'+
      '画质档位      '+QUALITY+'\n'+
      '星点数        '+(BGS[bgIdx]==='星空'?QCFG.stars:'—')+'\n'+
      '星空刷新      '+(BGS[bgIdx]==='星空'?QCFG.starMs+'ms':'—')+'\n'+
      '主循环节拍    1000ms';
  }
  requestAnimationFrame(rafSample);
}
window.addEventListener('keydown',e=>{ if(e.key==='p'||e.key==='P') perfToggle(); });
if(perfOn) perfToggle(true);
</script>
